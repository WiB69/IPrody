databaseChangeLog:
  - changeSet:
      id: create table 'outbox_message'
      author: dmitriev
      changes:
        - createTable:
            schemaName: payment_db
            tableName: OUTBOX_MESSAGE
            columns:
              - column:
                  name: ID
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: PAYMENT_ID
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: EVENT
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: AGGREGATE_ID
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: TRANSACTION_ID
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: STATUS
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: RETRY_COUNT
                  type: INT
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: TYPE
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: PROCESSED_AT
                  type: TIMESTAMP
                  constraints:
                    nullable: true
      rollback:
        - dropTable:
            tableName: OUTBOX_MESSAGE
            schemaName: payment_db